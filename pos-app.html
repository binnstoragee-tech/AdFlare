    <script>
      /* Only approved accounts can open the dashboard (fails closed). */
      (function () {
        var C = window.SUPABASE_CONFIG || {};
        function out() { try { sessionStorage.removeItem("afpos-session"); } catch (e) {} location.replace("pos.html"); }
        var t = setTimeout(out, 8000);
        try {
          var sb = window.supabase.createClient(C.url, C.anonKey, { auth: { storage: window.sessionStorage, persistSession: true, autoRefreshToken: true } });
          window.__afSb = sb;
          var uid = null, watching = false;
          function no() { sb.auth.signOut({ scope: "local" }).catch(function () {}); out(); }
          /* first = the check at page load (fails closed); later checks only act on a clear answer, never on a network hiccup */
          function check(first) {
            return sb.from("profiles").select("role,status").eq("id", uid).maybeSingle().then(function (p) {
              var d = p.data;
              if (!first && p.error) return;
              if (p.error || !d || d.status !== "approved") { no(); return; }
              if (d.role !== "super_admin" && d.role !== "master_admin" && d.role !== "admin") { no(); return; }
              return sb.rpc("afpos_me").then(function (m) {
                var x = m.data;
                if (!first && m.error) return;
                if (d.role === "admin" && (m.error || !x || !x.active)) { no(); return; }
                var changed = false, brChanged = false, otherChanged = false;
                try {
                  /* if the database function does not send an outlet list (old afpos_me), keep the list we already have - never wipe it back to "Outlet 1" */
                  var br = x && Array.isArray(x.outlets) ? JSON.stringify(x.outlets) : (sessionStorage.getItem("afpos-outlets") || "");
                  var lock = d.role === "admin" && x ? (x.outlet || "") : "";
                  var cn = x && x.name ? x.name : "";
                  changed = (sessionStorage.getItem("afpos-outlets") || "") !== br || (sessionStorage.getItem("afpos-outlet") || "") !== lock || (sessionStorage.getItem("afpos-cname") || "") !== cn;
                  brChanged = (sessionStorage.getItem("afpos-outlets") || "") !== br;
                  otherChanged = (sessionStorage.getItem("afpos-outlet") || "") !== lock || (sessionStorage.getItem("afpos-cname") || "") !== cn;
                  sessionStorage.setItem("afpos-cname", cn);
                  /* the company used to sign in lives in the database: keep it live (no reload, so nobody loses what they are typing) */
                  if (x && x.company) {
                    var prevCo = sessionStorage.getItem("afpos-company") || "";
                    sessionStorage.setItem("afpos-company", x.company);
                    if (prevCo !== x.company) { try { window.dispatchEvent(new CustomEvent("afpos-company")); } catch (e2) {} }
                  }
                  sessionStorage.setItem("afpos-rk", d.role); sessionStorage.setItem("afpos-outlet", lock); sessionStorage.setItem("afpos-outlets", br);
                } catch (e) { changed = false; }
                if (changed) {
                  /* only the outlet list changed (add / rename / delete elsewhere): update this screen live, no reload */
                  if (!first && brChanged && !otherChanged) { try { window.dispatchEvent(new CustomEvent("afpos-outlets")); return; } catch (e3) {} }
                  location.reload(); return;
                }
                if (first) { clearTimeout(t); document.documentElement.classList.remove("afgate"); watch(); }
              });
            });
          }
          /* live: the master disables / deletes this account, or the company outlets / outlet access change -> reacts within seconds */
          function watch() {
            if (watching) return; watching = true;
            var timer = null;
            function soon() { clearTimeout(timer); timer = setTimeout(function () { check(false); }, 300); }
            try { sb.channel("afpos-me").on("postgres_changes", { event: "*", schema: "public", table: "profiles", filter: "id=eq." + uid }, soon).subscribe(); } catch (e) {}
            setInterval(function () { if (!document.hidden) check(false); }, 15000);
            document.addEventListener("visibilitychange", function () { if (!document.hidden) check(false); });
          }
          sb.auth.getSession().then(function (r) {
            var s = r.data && r.data.session;
            if (!s) { out(); return; }
            uid = s.user.id;
            window.__afRefresh = function () { return check(false); };
            return check(true);
          }).catch(out);
        } catch (e) { out(); }
      })();
    </script>

  .app-shell.side-hidden{grid-template-columns:0px minmax(0,1fr)}
  .sidebar{width:258px;transition:transform .42s cubic-bezier(.22,1,.36,1),opacity .3s ease,visibility 0s}
  .side-hidden .sidebar{transform:translateX(-100%);opacity:0;visibility:hidden;pointer-events:none;transition:transform .42s cubic-bezier(.22,1,.36,1),opacity .3s ease,visibility 0s .42s}
  .menu-toggle{display:inline-grid;width:0;margin-right:-13px;border-width:0;opacity:0;visibility:hidden;overflow:hidden;transform:scale(.8);transition:width .42s cubic-bezier(.22,1,.36,1),margin .42s cubic-bezier(.22,1,.36,1),opacity .3s ease .12s,transform .3s ease .12s,visibility 0s .42s}
  .side-hidden .menu-toggle{width:32px;margin-right:0;border-width:1px;opacity:1;visibility:visible;overflow:visible;transform:none;transition:width .42s cubic-bezier(.22,1,.36,1),margin .42s cubic-bezier(.22,1,.36,1),opacity .3s ease .15s,transform .3s ease .15s,visibility 0s}

.tip-host{position:relative}
.tip{position:absolute;top:calc(100% + 8px);z-index:80;display:flex;align-items:center;gap:10px;padding:7px 11px;border-radius:9px;background:#17191f;color:#fff;font-size:11px;font-weight:550;line-height:1.2;white-space:nowrap;pointer-events:none;opacity:0;transform:translateY(-3px);transition:opacity .15s,transform .15s;box-shadow:0 8px 22px rgba(24,29,42,.22)}
.tip kbd{color:#a8acb7;font:inherit;font-weight:500}
.tip-r{right:0}.tip-l{left:0}
.tip-host:hover .tip,.tip-host:focus-visible .tip{opacity:1;transform:none;transition-delay:.25s}
@media(hover:none){.tip{display:none}}

/* ===== top bar polish ===== */
.topbar-actions{gap:12px}
.global-search{height:36px;border-radius:10px;background:var(--dm-bg-f7f8fa,#f7f8fa)}
.global-search:focus-within{background:var(--paper,#fff)}
.topbar-divider{height:22px;margin:0 2px}
.notification-btn{width:36px;height:36px;border-radius:10px;border-color:var(--line);background:var(--paper,#fff);color:var(--dm-fg-4b505b,#4b505b)}
.notification-btn:hover{background:var(--dm-bg-f7f8fa,#f7f8fa)}
.notification-btn i{top:8px;right:9px;width:7px;height:7px}
.top-avatar{width:36px;height:36px;padding:0;border:0;background:var(--brand-soft);color:var(--brand);font-size:11px;font-weight:700;letter-spacing:.02em;box-shadow:none;transition:background .2s,transform .15s}
.top-avatar:hover{box-shadow:none;background:var(--t-ffe3e6,#ffe3e6)}
.top-avatar:active{transform:scale(.95)}
.top-avatar:focus-visible{outline:2px solid var(--t-f27a85,#f27a85);outline-offset:3px}
@media(max-width:760px){.notification-btn,.top-avatar{width:32px;height:32px}.top-avatar{font-size:10px}.topbar-actions{gap:8px}}
/* ===== Interactive sales charts (click a point/bar to see its sales) ===== */
.lc-canvas{position:absolute;inset:4px 0 22px}
.lc-canvas .chart-grid-lines{inset:0}
.lc-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;animation:lc-reveal 1.15s cubic-bezier(.45,.05,.2,1) both}
.lc-line{filter:drop-shadow(0 4px 6px rgba(var(--rgb-a,237,41,57),.28))}
.lc-col{position:absolute;top:0;bottom:0;padding:0;border:0;background:transparent;font:inherit;color:inherit;cursor:pointer;transition:background .25s;-webkit-tap-highlight-color:transparent}
.lc-col:hover,.lc-col:focus-visible,.lc-col.is-picked{z-index:4}
.lc-col:hover,.lc-col.is-picked{background:linear-gradient(180deg,rgba(var(--rgb-a,237,41,57),.08),rgba(var(--rgb-a,237,41,57),0) 88%)}
.lc-col:focus-visible{outline:2px solid rgba(var(--rgb-a,237,41,57),.45);outline-offset:-2px;border-radius:8px}
.lc-guide{position:absolute;left:50%;top:0;bottom:0;width:1px;margin-left:-.5px;background:linear-gradient(180deg,rgba(var(--rgb-a,237,41,57),.6),rgba(var(--rgb-a,237,41,57),0));opacity:0;transform:scaleY(.5);transform-origin:50% 100%;transition:opacity .25s,transform .35s cubic-bezier(.2,.9,.3,1)}
.lc-col:hover .lc-guide,.lc-col:focus-visible .lc-guide,.lc-col.is-picked .lc-guide{opacity:1;transform:none}
.lc-dot{position:absolute;left:50%;top:var(--y);transform:translate(-50%,-50%);animation:lc-pop .55s cubic-bezier(.2,.9,.3,1.4) both;animation-delay:calc(var(--x,0)*1.15s + .12s)}
.lc-dot>span{position:relative;display:block;width:11px;height:11px;box-sizing:border-box;border-radius:50%;background:var(--paper,#fff);border:2.5px solid var(--t-ed2939,#ed2939);transition:transform .25s cubic-bezier(.2,.9,.3,1.5),background .2s,box-shadow .25s,opacity .25s}
.lc-col:hover .lc-dot>span,.lc-col:focus-visible .lc-dot>span{transform:scale(1.4)}
.lc-col.is-picked .lc-dot>span{transform:scale(1.3);background:var(--t-ed2939,#ed2939);box-shadow:0 0 0 5px rgba(var(--rgb-a,237,41,57),.16)}
.lc-col.is-picked .lc-dot>span:after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--t-ed2939,#ed2939);opacity:.5;animation:lc-ping 1.7s ease-out infinite}
.lc.has-pick .lc-col:not(.is-picked) .lc-dot>span{opacity:.5}
.lc-dot-sm{opacity:0;animation:none;transition:opacity .2s}
.lc-dot-sm>span{width:9px;height:9px;border-width:2px}
.lc-col:hover .lc-dot-sm,.lc-col:focus-visible .lc-dot-sm,.lc-col.is-picked .lc-dot-sm{opacity:1}
.lc-tip,.bar-tip{--tx:-50%;--ty:calc(-100% - 13px);--s:.92;position:absolute;left:50%;display:grid;gap:1px;padding:6px 10px;border-radius:9px;background:#17191f;color:#fff;font-size:8px;line-height:1.35;text-align:center;white-space:nowrap;pointer-events:none;opacity:0;z-index:6;box-shadow:0 10px 24px rgba(17,20,27,.28);transform:translate(var(--tx),var(--ty)) scale(var(--s));transition:opacity .18s,transform .25s cubic-bezier(.2,.9,.3,1.25)}
.lc-tip{top:var(--y)}
.lc-tip b,.bar-tip b{font-size:8.5px;font-weight:700;color:var(--t-ffb3ba,#ffb3ba)}
.lc-tip>span,.bar-tip>span{font-size:11px;font-weight:760;letter-spacing:-.2px}
.lc-tip small,.bar-tip small{font-size:8px;opacity:.72}
.lc-col.tip-below .lc-tip{--ty:15px}
.lc-col.is-first .lc-tip{left:0;--tx:0%}
.lc-col.is-last .lc-tip{left:auto;right:0;--tx:0%}
.lc-col:hover .lc-tip,.lc-col:focus-visible .lc-tip,.bar-col:hover .bar-tip,.bar-col:focus-visible .bar-tip{opacity:1;--s:1}
.chart-legend .lc-hint{margin-left:auto;display:inline-flex;align-items:center;gap:6px;color:#a0a3ac}
.lc-hint:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--brand);animation:lc-ping 1.7s ease-out infinite}
.bar-chart{gap:6px}
.bar-col{position:relative;padding:0;border:0;background:none;font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.bar-col.is-future{cursor:default}
.bar-col.is-future .bar-wrap{opacity:.55}
.bar-wrap{display:flex;transition:transform .25s cubic-bezier(.2,.9,.3,1.4),box-shadow .3s}
.bar-wrap i{display:block;transform-origin:50% 100%;transition:opacity .25s,filter .25s;animation:bar-grow .75s cubic-bezier(.2,.9,.25,1) both;animation-delay:calc(var(--i,0)*45ms + .1s)}
.bar-label{min-height:11px;line-height:11px;transition:color .2s}
.bar-col:not(.is-future):hover .bar-wrap,.bar-col:focus-visible .bar-wrap{transform:translateY(-3px) scaleX(1.12)}
.bar-col:focus-visible{outline:2px solid rgba(var(--rgb-a,237,41,57),.45);outline-offset:3px;border-radius:6px}
.bar-col.is-picked .bar-wrap{transform:translateY(-3px) scaleX(1.12);box-shadow:0 8px 18px rgba(var(--rgb-a,237,41,57),.32)}
.bar-col.is-picked .bar-wrap i{background:linear-gradient(0deg,var(--t-c51d31,#c51d31),var(--t-ef293b,#ef293b))}
.bar-col.is-picked .bar-label{color:var(--t-c51d31,#c51d31);font-weight:700}
.bar-chart.has-pick .bar-col:not(.is-picked) .bar-wrap i{opacity:.45}
.bar-tip{top:auto;bottom:calc(100% + 6px);--ty:0}
.bar-col:first-child .bar-tip{left:0;--tx:0%}
.bar-col:last-child .bar-tip{left:auto;right:0;--tx:0%}
.lc-still .lc-svg,.lc-still .lc-dot,.lc-still .bar-wrap i{animation:none!important}
.sales-detail{grid-column:1/-1;min-height:0!important;display:none;scroll-margin:86px 0 18px;padding-bottom:6px;border-color:var(--t-f6ccd1,#f6ccd1);background:linear-gradient(180deg,var(--t-fff7f8,#fff7f8),var(--paper,#fff) 90px)}
.sales-detail.is-open{display:block;animation:sd-in .5s cubic-bezier(.2,.85,.25,1) backwards}
.sales-detail.is-closing{display:block;animation:sd-out .17s ease-in forwards}
.sales-detail.sd-still,.sales-detail.sd-still .sd-head,.sales-detail.sd-still .sd-row{animation:none}
.sd-head{display:flex;align-items:center;flex-wrap:wrap;gap:12px 16px;padding:15px 16px 12px;animation:sd-row .4s cubic-bezier(.2,.85,.25,1) backwards}
.sd-title{display:flex;align-items:center;gap:10px;flex:1 1 190px;min-width:0}
.sd-badge{width:34px;height:34px;display:grid;place-items:center;flex:none;border-radius:10px;background:var(--brand-soft);color:var(--brand)}
.sd-title h2{margin:0;font-size:12px;font-weight:720;letter-spacing:-.2px}
.sd-title p{margin:3px 0 0;color:var(--muted);font-size:9px}
.sd-stats{display:flex;flex-wrap:wrap;gap:7px}
.sd-stats>div{min-width:72px;padding:6px 11px;border-radius:9px;background:var(--dm-bg-f5f6f8,#f5f6f8)}
.sd-stats small{display:block;color:#8a8f9a;font-size:8px}
.sd-stats b{color:var(--ink);font-size:10.5px;font-weight:740}
.sd-close{flex:none;transition:transform .25s cubic-bezier(.2,.9,.3,1.4)}
.sd-close:hover{transform:rotate(90deg)}
.sd-list{max-height:min(330px,46vh);overflow:auto;padding:0 14px;scrollbar-width:thin;scrollbar-color:#d9dce2 transparent}
.sd-row{padding:10px 8px;border-radius:9px;transition:background .2s,transform .25s cubic-bezier(.2,.9,.3,1.3);animation:sd-row .45s cubic-bezier(.2,.85,.25,1) backwards;animation-delay:calc(var(--i,0)*60ms + 90ms)}
.sd-row:hover{transform:translateX(4px)}
.sd-row .mini-person{flex:1;min-width:0}
.sd-meta{color:#8a8f9a;font-size:8.5px;white-space:nowrap}
.sd-empty{display:grid;justify-items:center;gap:4px;padding:26px 12px;color:#8a8f9a;font-size:9px;text-align:center;animation:sd-row .45s ease backwards}
.sd-empty span{width:44px;height:44px;display:grid;place-items:center;margin-bottom:4px;border-radius:50%;background:var(--brand-soft);color:var(--brand)}
.sd-empty b{color:var(--ink);font-size:10.5px}
.sd-foot{display:flex;justify-content:flex-end;padding:6px 20px 8px}
@media(max-width:640px){.sd-meta{display:none}.sd-stats{width:100%}.sd-stats>div{flex:1}}
@keyframes lc-reveal{from{clip-path:inset(-8% 100% -8% 0)}to{clip-path:inset(-8% -2% -8% 0)}}
@keyframes lc-pop{0%{transform:translate(-50%,-50%) scale(0)}65%{transform:translate(-50%,-50%) scale(1.3)}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes lc-ping{0%{transform:scale(.6);opacity:.55}100%{transform:scale(1.9);opacity:0}}
@keyframes bar-grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes sd-in{from{opacity:0;transform:translateY(-14px) scale(.985)}}
@keyframes sd-out{to{opacity:0;transform:translateY(-8px) scale(.99)}}
@keyframes sd-row{from{opacity:0;transform:translateY(10px)}}
@media(prefers-reduced-motion:reduce){.home-grid *,.home-grid *:before,.home-grid *:after{animation:none!important;transition:none!important}}
/* ===== Sidebar selected state: gray, not red ===== */
.nav-item.active,.outlet-menu button:hover,.outlet-menu button[aria-checked="true"],.settings-nav-item:hover,.settings-nav-item.active{background:var(--dm-bg-eceef2,#eceef2);color:var(--dm-fg-2b2f38,#2b2f38)}
.nav-item.active>.icon,.settings-nav-item.active>.icon{color:var(--dm-fg-4a4f5a,#4a4f5a)}
.nav-item:not(.active):hover{background:var(--wash,#f4f5f7);color:var(--dm-fg-2b2f38,#2b2f38)}
.outlet-mark{background:transparent;border-radius:0;box-shadow:none;color:var(--dm-fg-4a4f5a,#4a4f5a)}
.lc-line{stroke:var(--brand)}

/* ===== Appearance / color theme picker ===== */
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:12px;padding:4px 0 6px}
.theme-card{position:relative;display:grid;gap:9px;padding:10px;border:1.5px solid var(--line);border-radius:13px;background:var(--paper,#fff);text-align:left;font:inherit;color:inherit;cursor:pointer;transition:transform .22s cubic-bezier(.2,.9,.3,1.3),border-color .2s,box-shadow .25s}

.theme-card:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.theme-card.is-on{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 18%,transparent)}

.theme-preview .tp-card{left:30%;right:8%;top:28px;bottom:9px;border-radius:6px;background:var(--paper,#fff)}
.theme-preview .tp-bar{bottom:13px;width:7px;border-radius:3px 3px 1px 1px;background:linear-gradient(0deg,var(--dark),var(--c))}
.theme-preview .tp-bar.b1{left:36%;height:12px}.theme-preview .tp-bar.b2{left:46%;height:20px}.theme-preview .tp-bar.b3{left:56%;height:9px}.theme-preview .tp-bar.b4{left:66%;height:16px}
.theme-name{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:680;color:var(--ink)}
.theme-dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.theme-check{position:absolute;top:16px;right:16px;width:20px;height:20px;display:grid;place-items:center;border-radius:50%;background:var(--c);color:#fff;transform:scale(0);transition:transform .3s cubic-bezier(.2,.9,.3,1.5)}
.theme-card.is-on .theme-check{transform:scale(1)}
.theme-note{margin:12px 0 0;color:var(--muted);font-size:9px}

/* Banner — light, lively version (follows the selected theme colour) */
.brand-banner{min-height:150px;border:1px solid var(--line);color:var(--ink);background:radial-gradient(circle at 90% 15%,rgba(var(--rgb-b,239,41,59),.18),transparent 42%),radial-gradient(circle at 55% 120%,rgba(var(--rgb-b,239,41,59),.10),transparent 50%),linear-gradient(110deg,var(--paper,#fff) 0%,var(--brand-soft) 100%);box-shadow:var(--shadow)}
.brand-banner:before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(var(--rgb-b,239,41,59),.22) 1px,transparent 1.3px);background-size:16px 16px;-webkit-mask-image:linear-gradient(90deg,transparent 40%,#000);mask-image:linear-gradient(90deg,transparent 40%,#000)}
.banner-tag{color:var(--brand)}
.banner-content h2{color:var(--ink)}
.banner-content p{color:var(--muted)}
.banner-button{padding:7px 13px;border-radius:999px;background:var(--brand);color:#fff;box-shadow:0 5px 12px rgba(var(--rgb-b,239,41,59),.28);transition:transform .15s,background .15s}
.banner-button:hover{color:#fff;background:var(--brand-dark);transform:translateX(2px)}
.banner-ring{border-color:rgba(var(--rgb-b,239,41,59),.2)}
.banner-card{border:0;color:#fff;background:linear-gradient(145deg,var(--brand),var(--brand-dark));box-shadow:0 14px 28px rgba(var(--rgb-b,239,41,59),.35);animation:bnFloat 5s ease-in-out infinite}
.banner-card small{color:rgba(255,255,255,.82)}
.banner-card .spark{color:#fff}
.banner-line{background:linear-gradient(90deg,transparent,rgba(var(--rgb-b,239,41,59),.5),transparent)}
.banner-chip{position:absolute;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--paper,#fff);box-shadow:0 8px 20px rgba(24,29,42,.09);color:var(--ink);font-size:8px;font-weight:700;white-space:nowrap;animation:bnFloat 4s ease-in-out infinite}
.banner-chip i{width:7px;height:7px;border-radius:50%;background:#16a16d;box-shadow:0 0 0 3px rgba(22,161,109,.16)}
.banner-chip.chip-a{top:20px;right:3%}
.banner-chip.chip-b{bottom:22px;right:6%;animation-delay:-2s}
.banner-chip.chip-b i{background:var(--brand);box-shadow:0 0 0 3px rgba(var(--rgb-b,239,41,59),.16)}
@keyframes bnFloat{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-6px) rotate(var(--r,0deg))}}
.banner-card{--r:-8deg}
@media(max-width:640px){.banner-chip{display:none}}
@media(prefers-reduced-motion:reduce){.banner-card,.banner-chip{animation:none}}

/* Banner art — AdFlare building standing at the bottom */
.banner-art{top:auto;bottom:0;right:2%;width:36%;height:100%;display:flex;align-items:flex-end;justify-content:flex-end;overflow:hidden}
.banner-building{display:block;width:100%;height:100%}
.bb-beacon{animation:bbBlink 1.8s ease-in-out infinite}
.tw-a{animation:bbTw 3.2s ease-in-out infinite}.tw-b{animation:bbTw 4s ease-in-out -1.2s infinite}.tw-c{animation:bbTw 3.6s ease-in-out -2.2s infinite}
@keyframes bbBlink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes bbTw{0%,100%{fill-opacity:.9}50%{fill-opacity:.2}}
@media(prefers-reduced-motion:reduce){.bb-beacon,.tw-a,.tw-b,.tw-c{animation:none}}

/* Banner art — real AdFlare building photo, blended into the banner */
.brand-banner .banner-art{top:0;bottom:0;right:0;width:auto;height:100%;aspect-ratio:2.4/1;display:block;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 38%);mask-image:linear-gradient(90deg,transparent 0,#000 38%)}
.brand-banner .banner-art img{position:absolute;display:block;width:190%;max-width:none;left:-60%;top:-40%;height:auto;mix-blend-mode:multiply;filter:saturate(.9) contrast(1.03)}
@media(max-width:520px){.brand-banner .banner-art{opacity:.45}}
/* Flare inside the banner */
.brand-banner{min-height:178px}
.flare-box{position:absolute;right:26px;top:50%;transform:translateY(-50%);z-index:2;width:min(47%,480px);display:flex;align-items:flex-end;gap:12px}
/* ---- her face: blink, idle sway, expressions, talking mouth (shared by every avatar) ---- */
.flare-av svg { width: 100%; height: 100%; display: block; border-radius: 50%; pointer-events: none; }
.flare-av .fl-idle { transform-box: view-box; transform-origin: 50px 85px; animation: fl-idle 5.5s ease-in-out infinite; }
.flare-av .fl-head { transform-box: view-box; transform-origin: 50px 85px; transition: transform .38s cubic-bezier(.2, .9, .3, 1.3); }
.flare-av .eyes { transform-box: fill-box; transform-origin: center; animation: fl-blink 4.6s infinite; }
.flare-av .fx { transform-box: fill-box; transform-origin: center; transition: opacity .18s ease, transform .32s cubic-bezier(.2, .9, .3, 1.3), translate .3s ease; }
.flare-av .blush { opacity: 0; transition: opacity .3s; }
.flare-av .pose { opacity: 0; transition: opacity .22s ease; }
.flare-av .pose-r { opacity: 1; }
.flare-av[data-look="front"] .pose-r, .flare-av[data-look="left"] .pose-r, .flare-av[data-look="up"] .pose-r, .flare-av[data-look="down"] .pose-r { opacity: 0; }
.flare-av[data-look="front"] .pose-f, .flare-av[data-look="up"] .pose-f, .flare-av[data-look="down"] .pose-f, .flare-av[data-look="left"] .pose-l { opacity: 1; }
/* looking up / down: head tips a little and the eyes, cheeks and mouth slide inside the face (uses the separate "translate" property so blinking and expressions keep working) */
.flare-av .fl-tilt { transform-box: view-box; transform-origin: 50px 85px; transition: transform .38s cubic-bezier(.2, .9, .3, 1.3); }
.flare-av .eyes, .flare-av .blush { transition: translate .3s ease; }
.flare-av[data-look="up"] .fl-tilt { transform: translateY(-1.5px) scaleY(1.02); }
.flare-av[data-look="down"] .fl-tilt { transform: translateY(1.5px) scaleY(.96); }
.flare-av[data-look="up"] .eyes, .flare-av[data-look="up"] .blush { translate: 0 -3px; }
.flare-av[data-look="down"] .eyes, .flare-av[data-look="down"] .blush { translate: 0 3px; }
.flare-av[data-look="up"] .m-n, .flare-av[data-look="up"] .m-smile, .flare-av[data-look="up"] .m-big, .flare-av[data-look="up"] .m-o, .flare-av[data-look="up"] .m-flat, .flare-av[data-look="up"] .m-sad, .flare-av[data-look="up"] .m-talk { translate: 0 -1.6px; }
.flare-av[data-look="down"] .m-n, .flare-av[data-look="down"] .m-smile, .flare-av[data-look="down"] .m-big, .flare-av[data-look="down"] .m-o, .flare-av[data-look="down"] .m-flat, .flare-av[data-look="down"] .m-sad, .flare-av[data-look="down"] .m-talk { translate: 0 1.8px; }
.flare-av .hL, .flare-av .hR, .flare-av .m-smile, .flare-av .m-big, .flare-av .m-o, .flare-av .m-flat, .flare-av .m-sad, .flare-av .m-talk { opacity: 0; }
@keyframes fl-blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.08); } }
@keyframes fl-idle { 0%, 100% { transform: rotate(-1.2deg) translateY(0); } 50% { transform: rotate(1.2deg) translateY(-.6px); } }
@keyframes fl-bob { 50% { transform: translateY(-3px); } }

/* expressions */
.flare-av[data-ex="happy"] .eL, .flare-av[data-ex="happy"] .eR, .flare-av[data-ex="excited"] .eL, .flare-av[data-ex="excited"] .eR { opacity: 0; }
.flare-av[data-ex="happy"] .hL, .flare-av[data-ex="happy"] .hR, .flare-av[data-ex="excited"] .hL, .flare-av[data-ex="excited"] .hR { opacity: 1; }
.flare-av[data-ex="happy"] .m-n, .flare-av[data-ex="excited"] .m-n, .flare-av[data-ex="wink"] .m-n, .flare-av[data-ex="curious"] .m-n, .flare-av[data-ex="listen"] .m-n,
.flare-av[data-ex="think"] .m-n, .flare-av[data-ex="sorry"] .m-n { opacity: 0; }
.flare-av[data-ex="happy"] .m-smile, .flare-av[data-ex="wink"] .m-smile, .flare-av[data-ex="excited"] .m-big, .flare-av[data-ex="curious"] .m-o, .flare-av[data-ex="listen"] .m-o,
.flare-av[data-ex="think"] .m-flat, .flare-av[data-ex="sorry"] .m-sad { opacity: 1; }
.flare-av[data-ex="listen"] .m-o { transform: scale(.65); }
.flare-av[data-ex="wink"] .eR { opacity: 0; }
.flare-av[data-ex="wink"] .hR { opacity: 1; }
.flare-av[data-ex="happy"] .blush, .flare-av[data-ex="excited"] .blush, .flare-av[data-ex="wink"] .blush { opacity: 1; }
.flare-av[data-ex="curious"] .eL, .flare-av[data-ex="listen"] .eL { transform: translateY(-2px); }
.flare-av[data-ex="curious"] .eR { transform: translateY(-3px) scaleY(1.25); }
.flare-av[data-ex="listen"] .eR { transform: translateY(-2px); }
.flare-av[data-ex="think"] .eL, .flare-av[data-ex="think"] .eR { transform: translate(3px, -3px); }
.flare-av[data-ex="sorry"] .eR { transform: rotate(-18deg); }
.flare-av[data-ex="happy"] .fl-head { transform: rotate(-3deg); }
.flare-av[data-ex="excited"] .fl-head { transform: rotate(-2deg) scale(1.05); }
.flare-av[data-ex="wink"] .fl-head { transform: rotate(-3deg); }
.flare-av[data-ex="curious"] .fl-head, .flare-av[data-ex="listen"] .fl-head { transform: rotate(4deg); }
.flare-av[data-ex="think"] .fl-head { transform: rotate(5deg); }
.flare-av[data-ex="sorry"] .fl-head { transform: rotate(-5deg) translateY(1px); }

/* talking: the mouth flaps with an uneven rhythm, like real speech (transform + opacity only) */
:is(.is-talking.flare-av, .is-talking .flare-av) :is(.m-n, .m-smile, .m-big, .m-o, .m-flat, .m-sad) { opacity: 0; }
:is(.is-talking.flare-av, .is-talking .flare-av) .m-talk { opacity: 1; }
:is(.is-talking.flare-av, .is-talking .flare-av) .mt-in { transform-box: fill-box; transform-origin: 50% 0; animation: fl-talk .74s linear infinite; }
:is(.is-talking.flare-av, .is-talking .flare-av)[data-ex="sorry"] .m-talk { transform: rotate(180deg); }
:is(.is-talking.flare-av, .is-talking .flare-av)[data-ex="curious"] .m-talk, :is(.is-talking.flare-av, .is-talking .flare-av)[data-ex="listen"] .m-talk { transform: scaleX(.75); }
:is(.is-talking.flare-av, .is-talking .flare-av)[data-ex="excited"] .m-talk { transform: scale(1.12); }
@keyframes fl-talk {
  0% { transform: scale(.9, .25); } 14% { transform: scale(1, .95); } 28% { transform: scale(.85, .4); } 42% { transform: scale(1.06, 1.05); }
  57% { transform: scale(.9, .3); } 71% { transform: scale(1, .78); } 86% { transform: scale(.88, .5); } 100% { transform: scale(.9, .25); }

    if (state.view !== "users" || U.loading || U.list === null || document.hidden || !isSuperUser()) return;
    usersSb().rpc("sa_list_outlet_admins").then((r) => {
      if (r.error) return;

        inp.onchange = () => restorePick(inp.files && inp.files[0]);
        state.popover = null;
        inp.click();
        return rootRender();
      }
      case "export-all":
        exportAllJson();
        toast("Exported all data.");
        state.popover = null;
        return rootRender();
      case "export-all-xlsx": {
        let n = 0;
        try { n = exportAllXlsx(); toast(`Exported ${n} records to Excel.`); } catch (e) { toast("Could not build the Excel file. Use Export JSON instead.", "warn"); }
        state.popover = null;
        return rootRender();
      }
      case "export":
        return exportCurrent();
      case "export-report":
        return exportCurrent();
      case "export-products":
        return toast(`Exported products to ${exportTable("products", "Products", pageMeta.products.columns, state.data.products, "products")}.`);
      case "page-prev":
        state.page = Math.max(0, state.page - 1);
        return refreshTable();
      case "page-next":
        state.page += 1;
        return refreshTable();
      case "create": {
        if (state.view === "sessions") return openModal({ type: "open-register" }, '[data-action="create"]');
        const key = pageMeta[state.view]?.dataKey;
        if (!key) return;
        return openModal({ type: "create", key }, '[data-action="create"]');
      }
      case "new-stock-count":
        go("stock-counts");
        return openModal({ type: "create", key: "stockCounts" });
      case "detail": {
        const list = state.data[ds.key] || [];
        if (!list[Number(ds.index)]) return;
        return openModal({ type: "detail", key: ds.key, index: Number(ds.index), tab: null }, `[data-action="detail"][data-key="${ds.key}"][data-index="${ds.index}"]`);
      }
      case "gs-open": {
        const { view, key, index } = ds;
        state.gq = "";
        go(view);
        return openModal({ type: "detail", key, index: Number(index) });
      }
      case "row-action":
        return openRowAction(ds.key, Number(ds.index), ds.act);
      case "edit-record":
        return openModal({ type: "edit", key: ds.key, index: Number(ds.index) });
      case "delete-record": {
        const row = state.data[ds.key][Number(ds.index)];
        return openModal({ type: "confirm", title: "Delete record", message: `Delete ${row?.name || row?.id || row?.code || row?.sku || "this record"}? This can't be undone.`, confirmLabel: "Delete", onConfirm: { kind: "delete", key: ds.key, index: Number(ds.index) } });
      }
      case "confirm-yes": {
        const c = state.modal?.onConfirm;
        if (!c) return;
        if (c.kind === "import-pick") {
          closeModal();
          return importPick(c.key);
        }
        if (c.kind === "import-apply") {
          closeModal();
          return importApply();
        }
        if (c.kind === "dt-save" || c.kind === "dt-reset") {
          closeModal();
          if (!isSuperUser()) return toast("Only the Super Admin can change the template.", "warn");
          if (c.kind === "dt-save") { DT.draft.tplMode = dtUseOwn(DT.draft) ? "own" : "default"; state.settings = { ...state.settings, docTemplate: clone(DT.draft) }; DT.dirty = false; save(); render(); return toast("Template saved. New documents use it right away."); }
          DT.draft = clone(DT_DEF); DT.dirty = false; state.settings = { ...state.settings, docTemplate: null }; save(); render();
          return toast("Template reset to the default design.");
        }
        if (c.kind === "restore") {
          closeModal();
          return applyRestore();
        }
        if (c.kind === "reset") {
          if (!isSuperUser()) { closeModal(); return toast("Only the Super Admin can reset the data.", "warn"); }
          resetData();
          closeModal();
          go("home");
          return toast("Data reset.");
        }
        if (c.kind === "delete") {
          const err = deleteRecord(c.key, c.index);
          if (err) return fail(err);
          closeModal();
          rootRender();
          return toast("Deleted.");
        }
        return applyResult(runRowAction(c.key, c.index, c.act));
      }
      case "add-cart": {
        const r = addToCart(ds.id);
        if (r === null) {
          refreshCart();
          toast("Added to sale.");
        }
        return;
      }
      case "qty-up":
      case "qty-down":
        updateCart(ds.id || null, a === "qty-up" ? 1 : -1, ds.name);
        return refreshCart();
      case "clear-cart":
        clearCart();
        return rootRender();
      case "product-filter":
        state.inStockOnly = !state.inStockOnly;
        return rootRender();
      case "checkout":
        if (!state.cart.length) return;
        if (!openSession()) {
          toast("Open the register to complete a sale.", "warn");
          return openModal({ type: "open-register" });
        }
        return openModal({ type: "checkout" }, '[data-action="checkout"]');
      case "save-quote": {
        const r = saveCartAsQuote();
        if (r && r.startsWith("The")) return toast(r, "warn");
        rootRender();
        return toast(`${r} saved. Find it under Quotations.`);
      }
      case "open-register-modal":
        return openModal({ type: "open-register" });
      case "close-register-modal": {
        const s = openSession();
        return s && openModal({ type: "close-register", sessionId: s.id });
      }
      case "cash-move-modal":
        return openModal({ type: "cash-move" });
      case "print-receipt":
        return window.print();
      default:
    }
  }
  function onInput(event) {
    const t = event.target;
    if (t.name === "skuPrefix" && document.getElementById("sku-example")) {
      const pre = String(t.value).trim() || "AF", next = 1001 + (d().products ? d().products.length : 0), ex = document.getElementById("sku-example");
      ex.querySelector("[data-sku-pre]").textContent = pre;
      ex.querySelector("[data-sku-full]").textContent = pre + "-" + next;
      ex.querySelector("[data-sku-next]").textContent = pre + "-" + next + ", " + pre + "-" + (next + 1);
      return;
    }
    if (t.matches("[data-page-search]")) {
      state.query = t.value;
      state.page = 0;
      refreshTable("[data-page-search]");
    } else if (t.matches("[data-global-search]")) {
      state.gq = t.value;
      refreshTopbar();
    } else if (t.matches("[data-product-search]")) {
      state.productQuery = t.value;
      refreshProducts();
    } else if (t.matches("[data-cart-discount]")) {
      state.cartDiscount = t.value;
      save();
      refreshCart("[data-cart-discount]");
    } else if (t.matches("[data-tendered]")) updateChange(t);
    else if (t.matches("[data-counted]")) updateVariance(t);
  }
  function onChange(event) {
    const t = event.target;
    if (t.matches("[data-status-filter]")) {
      state.statusFilter = t.value;
      state.page = 0;
      refreshTable();
    } else if (t.matches("[data-table-period]")) {
      state.tablePeriod = t.value;
      state.page = 0;
      refreshTable();
    } else if (t.matches("[data-home-filter]")) {
      const k = t.dataset.homeFilter;
      state[k] = t.value;
      state.page = 0;
      save();
      rootRender();
      app.querySelector(`[data-home-filter="${k}"]`)?.focus();
    } else if (t.matches("[data-chart-metric]")) {
      state.chartMetric = t.value;
      rootRender();
    } else if (t.matches("[data-cart-customer]")) {
      state.cartCustomer = t.value;
      state.redeemPoints = false;
      save();
      refreshCart();
    } else if (t.matches("[data-cart-discount-type]")) {
      state.cartDiscountType = t.value;
      refreshCart();
    } else if (t.matches("[data-cart-redeem]")) {
      state.redeemPoints = t.checked;
      refreshCart();
    } else if (t.matches("[data-receive-po]")) {
      state.receivePo = t.value;
      rootRender();
    } else if (t.name === "method" && t.type === "radio") {
      app.querySelectorAll("[data-method-section]").forEach((el) => {
        el.hidden = el.dataset.methodSection !== t.value;
      });
      if (state.modal) state.modal.error = null;
      app.querySelector(".form-error")?.remove();
    }
  }
  function onSubmit(event) {
    const form = event.target.closest("form[data-form]");
    if (!form) return;
    event.preventDefault();
    const type = form.dataset.form;
    const values = formValues(form);
    const m = state.modal;
    const withErr = (err) => {
      if (err) {
        m.error = err;
        m.values = values;
        rootRender();
        return true;
      }
      return false;
    };
    /* register actions first read the latest saved state from the database (other devices may have opened / closed / sold) */
    const afterSync = (fn) => {
      if (m && m.busy) return;
      if (m) m.busy = true;
      cSyncNow().then(() => { if (m) m.busy = false; fn(); });
    };
    switch (type) {
      case "create": {
        if (withErr(createRecord(m.key, values))) return;
        const label = m.key;
        closeModal();
        rootRender();
        return toast(`Added to ${label.replace(/([A-Z])/g, " $1").toLowerCase()}.`);
      }
      case "edit": {
        if (withErr(updateRecord(m.key, m.index, values))) return;
        closeModal();
        rootRender();
        return toast("Changes saved.");
      }
      case "prompt": {
        const res = runRowAction(m.key, m.index, m.act, values);
        if (res.error) {
          m.error = res.error;
          m.values = values;
          return rootRender();
        }
        return applyResult(res);
      }
      case "checkout": {
        return afterSync(() => {
          if (withErr(completeSale(values))) return;
          rootRender();
          toast("Sale completed.");
        });
      }
      case "receive": {
        const err = receiveStock(values);
        if (err) return toast(err, "warn");
        rootRender();
        return toast("Receipt recorded. Stock updated.");
      }
      case "open-register": {
        return afterSync(() => {
          if (withErr(openRegister(values))) return;
          closeModal();
          rootRender();
          toast("Register opened.");
        });
      }
      case "close-register": {
        return afterSync(() => {
          if (withErr(closeRegister(m.sessionId, values))) return;
          const s = state.data.sessions.find((x) => x.id === m.sessionId);
          closeModal();
          rootRender();
          toast(`Register closed. Variance ${s.variance > 0 ? "+" : ""}${s.variance}.`);
        });
      }
      case "cash-move": {
        return afterSync(() => {
          if (withErr(cashMove(values))) return;
          closeModal();
          rootRender();
          toast("Cash movement recorded.");
        });
      }
      case "count": {
        if (withErr(applyStockCount(m.index, values))) return;
        closeModal();
        rootRender();
        return toast("Stock count completed. Stock updated.");
      }
      case "settings": {
        const meta = pageMeta[state.view];
        const fields = meta && pageMetaSettings(meta.key) || [];
        const err = saveSettings(fields, values);
        if (err) return toast(err, "warn");
        rootRender();
        return toast("Settings saved.");
      }
      default:
    }
  }
  var pageMetaSettings = (key) => settingsFields[key];
  function setSidebar(show) {
    const shell = app.querySelector(".app-shell");
    if (window.matchMedia("(max-width:760px)").matches) {
      state.mobileNav = show;
      shell && shell.classList.toggle("nav-open", show);
    } else {
      state.sideHidden = !show;
      try { localStorage.setItem("afpos_side_hidden", state.sideHidden ? "1" : "0"); } catch (e) {}
      if (!show && document.activeElement && document.activeElement.closest && document.activeElement.closest(".sidebar")) document.activeElement.blur();
      shell && shell.classList.toggle("side-hidden", !show);
    }
  }
  function onKeydown(event) {
    if ((event.metaKey || event.ctrlKey) && !event.shiftKey && !event.altKey && event.key.toLowerCase() === "b") {
      event.preventDefault();
      const mobile = window.matchMedia("(max-width:760px)").matches;
      setSidebar(mobile ? !state.mobileNav : Boolean(state.sideHidden));
      return;
    }
    if (event.key === "Enter" && event.target.matches?.("[data-product-search]")) {
      event.preventDefault();
      const q = state.productQuery.trim().toLowerCase();
      if (!q) return;
      const hits = state.data.products.filter((p) => p.sku.toLowerCase() === q || p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q));
      const exact = hits.find((p) => p.sku.toLowerCase() === q) || (hits.length === 1 ? hits[0] : null);
      if (exact) {
        if (addToCart(exact.sku) === null) {
          state.productQuery = "";
          rootRender();
          toast(`${exact.name} added.`);
          app.querySelector("[data-product-search]")?.focus();
        }
      }
      return;
    }
    if (event.key === "Escape") {
      if (state.modal) {
        closeModal();
        rootRender();
      } else if (state.popover) {
        state.popover = null;
        rootRender();
      } else if (state.mobileNav) {
        state.mobileNav = false;
        rootRender();
      } else if (state.outletMenuOpen) {
        state.outletMenuOpen = false;
        rootRender();
        app.querySelector('[data-action="outlet-menu"]')?.focus();
      } else if (state.gq) {
        state.gq = "";
        refreshTopbar();
      }
    }
    if (event.key === "Tab" && state.modal) {
      const dialog = app.querySelector('[role="dialog"]');
      const focusable = [...dialog?.querySelectorAll('button:not(:disabled), input:not(:disabled), select:not(:disabled), textarea:not(:disabled), [tabindex]:not([tabindex="-1"])') || []].filter((el) => el.getClientRects().length);
      if (!focusable.length) {
        event.preventDefault();
        dialog?.focus({ preventScroll: true });
        return;
      }
      const first = focusable[0];
      const last = focusable.at(-1);
      if (event.shiftKey && (document.activeElement === first || !dialog.contains(document.activeElement))) {
        event.preventDefault();
        last.focus({ preventScroll: true });
      } else if (!event.shiftKey && (document.activeElement === last || !dialog.contains(document.activeElement))) {
        event.preventDefault();
        first.focus({ preventScroll: true });
      }
    }
  }
})();
