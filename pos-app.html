    <script>
      /* Only approved accounts can open the dashboard (fails closed). */
      (function () {
        var C = window.SUPABASE_CONFIG || {};
        function out() { try { AFS.removeItem("afpos-session"); } catch (e) {} location.replace("pos.html"); }
        var t = setTimeout(out, 8000);

                if (d.role === "admin" && (m.error || !x || !x.active)) { no(); return; }

                  /* if the database function does not send an outlet list (old afpos_me), keep the list we already have - never wipe it back to "Outlet 1" */
                  var br = x && Array.isArray(x.outlets) ? JSON.stringify(x.outlets) : (AFS.getItem("afpos-outlets") || "");
                  var lock = d.role === "admin" && x ? (x.outlet || "") : "";
                  var cn = x && x.name ? x.name : "";
                  changed = (AFS.getItem("afpos-outlets") || "") !== br || (AFS.getItem("afpos-outlet") || "") !== lock || (AFS.getItem("afpos-cname") || "") !== cn;
                  brChanged = (AFS.getItem("afpos-outlets") || "") !== br;
                  otherChanged = (AFS.getItem("afpos-outlet") || "") !== lock || (AFS.getItem("afpos-cname") || "") !== cn;
                  AFS.setItem("afpos-cname", cn);

                } catch (e) { changed = false; }

        } catch (e) { out(); }

.chart-legend .lc-hint{margin-left:auto;display:inline-flex;align-items:center;gap:6px;color:#a0a3ac}
.lc-hint:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--brand);animation:lc-ping 1.7s ease-out infinite}

.bar-label{min-height:11px;line-height:11px;transition:color .2s}

.sales-detail{grid-column:1/-1;min-height:0!important;display:none;scroll-margin:86px 0 18px;padding-bottom:6px;border-color:var(--t-f6ccd1,#f6ccd1);background:linear-gradient(180deg,var(--t-fff7f8,#fff7f8),var(--paper,#fff) 90px)}

.sd-head{display:flex;align-items:center;flex-wrap:wrap;gap:12px 16px;padding:15px 16px 12px;animation:sd-row .4s cubic-bezier(.2,.85,.25,1) backwards}
.sd-title{display:flex;align-items:center;gap:10px;flex:1 1 190px;min-width:0}
.sd-badge{width:34px;height:34px;display:grid;place-items:center;flex:none;border-radius:10px;background:var(--brand-soft);color:var(--brand)}

.sd-row:hover{transform:translateX(4px)}

@keyframes lc-reveal{from{clip-path:inset(-8% 100% -8% 0)}to{clip-path:inset(-8% -2% -8% 0)}}
@keyframes lc-pop{0%{transform:translate(-50%,-50%) scale(0)}65%{transform:translate(-50%,-50%) scale(1.3)}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes lc-ping{0%{transform:scale(.6);opacity:.55}100%{transform:scale(1.9);opacity:0}}
@keyframes bar-grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes sd-in{from{opacity:0;transform:translateY(-14px) scale(.985)}}
@keyframes sd-out{to{opacity:0;transform:translateY(-8px) scale(.99)}}

/* ---- intro: nicer entrance, glow and word-by-word subtitle ---- */

@keyframes ptFade{from{opacity:0}to{opacity:1}}

.pt-bubble.intro:before{content:"";position:absolute;inset:-1px;z-index:-1;border-radius:inherit;border:1px solid rgba(var(--rgb-b,239,41,59),.3);background:linear-gradient(135deg,transparent 58%,rgba(var(--rgb-b,239,41,59),.08)),var(--paper,#fff);background-color:var(--paper,#fff);box-shadow:0 26px 70px rgba(0,0,0,.3),0 0 0 7px rgba(var(--rgb-b,239,41,59),.08);opacity:1;transition:opacity .3s ease}

.pt-bubble.intro .pt-mini{position:relative;overflow:visible;animation:ptFloat 3.4s ease-in-out infinite}
@keyframes ptFloat{0%,100%{translate:0 0}50%{translate:0 -5px}}

@keyframes ptHalo{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.45);opacity:0}}
.pt-bubble.intro .pt-body b{display:inline-block;padding:3px 9px;margin-bottom:7px;border-radius:999px;background:rgba(var(--rgb-b,239,41,59),.1);letter-spacing:.1em}
.pt-bubble.intro .pt-body span{font-size:15.5px;line-height:1.55;font-weight:500}
.pt-bubble.intro .pt-body{animation:none;max-width:380px;max-height:260px;transition:none}
.pt-bubble.intro .pt-body span{width:max-content;max-width:330px}
.pt-bubble.intro.hold .pt-body{max-width:0;max-height:0;opacity:0;margin-left:-16px;overflow:hidden}
.pt-bubble.intro.hold .pt-body span i{animation:none;opacity:0}
.pt-bubble.intro.unfurl .pt-body{transition:max-width .85s cubic-bezier(.3,.8,.3,1),max-height .85s cubic-bezier(.3,.8,.3,1),opacity .5s ease .25s,margin .85s cubic-bezier(.3,.8,.3,1)}
.pt-bubble.intro.slide{transition:opacity .2s ease,transform .25s cubic-bezier(.2,.9,.3,1.3),left .85s cubic-bezier(.3,.8,.3,1),top .85s cubic-bezier(.3,.8,.3,1)}
.pt-bubble.intro .pt-body span i{display:inline-block;font-style:normal;opacity:0;transform:translateY(7px);animation:ptWord .45s cubic-bezier(.2,.9,.3,1.25) forwards;animation-delay:calc(var(--w,0)*42ms + .45s)}
@keyframes ptWord{to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.pt-bubble.intro.on,.pt-bubble.intro .pt-mini,.pt-bubble.intro .pt-mini:before{animation:none}.pt-bubble.intro .pt-body span i{animation:none;opacity:1;transform:none}.pt-tour.intro-on:before{animation:none}}
/* ---- Flare's first chat bubble: hug the text instead of a big empty box ---- */
.brand-banner .flare-log{min-height:0;max-height:96px}

/* Sell page: the cart fits the screen so Checkout is always reachable; only the item list scrolls */

}

  .table-scroll tbody td::before{content:attr(data-label);flex:none;max-width:42%;text-align:left;color:#9296a0;font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
  .table-scroll tbody td:not([data-label])::before{display:none}

  .table-scroll tbody td.row-actions{position:absolute;top:4px;right:6px;width:auto;padding:0!important;justify-content:flex-end}
  .table-scroll tbody td.row-actions::before{display:none}
  .table-scroll .p-cell{justify-content:flex-end;text-align:right}
  .table-scroll.infinite{max-height:none}
}

/* photo viewer: square corners, picture only */
.pv-card,.pv-img,.pv-img img{border-radius:0!important}
.pv-x{border-radius:0;top:0!important;right:0!important;width:30px!important;height:30px!important;z-index:10}.pv-x:before,.pv-x:after{width:14px!important}
/* =====================================================================
   PROFESSIONAL POLISH - one size + spacing scale for the whole POS.
   Kept LAST on purpose so it wins over the older one-off rules above.
   Scale (before the 1.25 UI zoom): text 9 / 10 / 11 / 13 / 21,  spacing 4 / 8 / 12 / 16 / 20 / 24.
   Delete this block to go back to the old look.
   ===================================================================== */
:root{--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--fs-micro:9px;--fs-cap:10px;--fs-body:11px;--fs-title:13px;--fs-h1:21px}

/* page frame + heading */
.page-content{padding:var(--sp-6) 32px 40px}
.page-heading{align-items:flex-end;margin-bottom:var(--sp-5)}
.page-heading .eyebrow{font-size:var(--fs-micro);letter-spacing:.14em;line-height:1.2}
.page-heading h1{margin:var(--sp-1) 0 0;font-size:var(--fs-h1);line-height:1.2;letter-spacing:-.4px}
.page-heading p{margin:var(--sp-1) 0 0;font-size:var(--fs-body);line-height:1.4;color:var(--muted)}
.heading-actions{gap:var(--sp-2)}
.select-wrap{height:34px;padding:0 var(--sp-3);font-size:var(--fs-body)}

/* hero banner: compact, one calm row */
.brand-banner{min-height:0;margin:0 0 var(--sp-5);padding:var(--sp-5) 28px;gap:var(--sp-6);align-items:center;border-radius:var(--radius)}
.brand-banner .banner-content{flex:1 1 0;min-width:0}
.brand-banner .banner-tag{font-size:var(--fs-micro);letter-spacing:.14em}
.brand-banner .banner-content h2{margin:var(--sp-2) 0 var(--sp-1);font-size:var(--fs-h1);line-height:1.2;letter-spacing:-.4px}
.brand-banner .banner-content p{font-size:var(--fs-body);line-height:1.45}
.brand-banner .banner-button{margin-top:var(--sp-4);padding:0 var(--sp-4);height:32px;font-size:var(--fs-body);font-weight:700}
.brand-banner .flare-box{flex:1.7 1 0;grid-template-columns:76px minmax(0,1fr);gap:var(--sp-4);align-items:center}
.brand-banner .flare-av,.brand-banner .flare-av.is-talking{width:76px;height:76px;filter:drop-shadow(0 4px 8px rgba(var(--rgb-b,239,41,59),.2))}
.flare-who{gap:var(--sp-1)}
.flare-name{font-size:var(--fs-micro);gap:var(--sp-1)}
.brand-banner .flare-main{gap:var(--sp-2)}
.brand-banner .flare-bubble{padding:var(--sp-2) var(--sp-3);font-size:var(--fs-body);line-height:1.5;border-radius:12px 12px 12px 4px}
.brand-banner .flare-tag{font-size:var(--fs-micro);letter-spacing:.1em;line-height:1.3}
.brand-banner .flare-head{margin-bottom:var(--sp-1)}
.brand-banner .flare-log{max-height:70px;min-height:0}
.brand-banner .flare-msg{font-size:var(--fs-body);line-height:1.5;padding:var(--sp-1) 10px}
.brand-banner .flare-chips{gap:var(--sp-1) 6px}
.brand-banner .flare-chip{padding:0 10px;height:22px;display:inline-flex;align-items:center;font-size:var(--fs-micro)}
.brand-banner .flare-input{height:30px;padding:0 var(--sp-3);font-size:var(--fs-cap)}
.brand-banner .flare-send{width:30px;height:30px}

/* KPI cards */
.metric-grid{gap:var(--sp-3);margin:0 0 var(--sp-5)}
.metric-card{padding:var(--sp-4);min-height:0}
.metric-icon{width:30px;height:30px;border-radius:9px}
.metric-label{margin-top:var(--sp-3);font-size:var(--fs-cap);line-height:1.3;letter-spacing:.01em}
.metric-card>strong{margin-top:var(--sp-1);font-size:18px;line-height:1.25;letter-spacing:-.3px}
.metric-foot{margin-top:var(--sp-2);font-size:var(--fs-micro);line-height:1.3}

/* content cards + charts */
.content-grid,.home-grid{gap:var(--sp-3)}
.home-grid{margin-bottom:var(--sp-3)}
.card-head{padding:var(--sp-4) var(--sp-4) 0;gap:var(--sp-3);align-items:flex-start}
.card-head h2{font-size:var(--fs-title);line-height:1.3;letter-spacing:-.1px}
.card-head p{margin:2px 0 0;font-size:var(--fs-cap);line-height:1.35}
.count-total{font-size:18px;line-height:1.2}
.count-total small{font-size:var(--fs-cap)}
.chart-legend{padding:var(--sp-3) var(--sp-4) 0;font-size:var(--fs-cap)}
.chart-x span,.chart-y span,.bar-label{font-size:var(--fs-cap);line-height:1.3;color:var(--muted)}
.bar-label{font-weight:500}
.home-grid>.card{min-height:0}
.bar-chart{padding:var(--sp-4) var(--sp-4) 0}
.empty,.empty-state{padding:var(--sp-5);font-size:var(--fs-cap)}

/* sidebar rhythm */
.nav-item,.nav-link{min-height:34px;padding:var(--sp-2) 10px;font-size:var(--fs-body);gap:var(--sp-3)}
.nav-label,.nav-section{padding:var(--sp-2) 10px;font-size:var(--fs-micro);letter-spacing:.12em}
.topbar{height:60px}
.breadcrumbs{font-size:var(--fs-cap)}

/* tablets / phones: keep the same scale but stack */
@media(max-width:900px){
  .page-content{padding:var(--sp-4) var(--sp-4) 28px}
  .brand-banner{flex-wrap:wrap;padding:var(--sp-4);gap:var(--sp-4)}
  .brand-banner .banner-content,.brand-banner .flare-box{flex:1 1 100%}
  .brand-banner .flare-box{grid-template-columns:60px minmax(0,1fr);gap:var(--sp-3)}
  .brand-banner .flare-av,.brand-banner .flare-av.is-talking{width:60px;height:60px}
}

    if (i) openCombo(i, false);
  });
  document.addEventListener('input', function(e){
    var i = comboInput(e.target);
    if (i) openCombo(i, true);
  });

  // keyboard: arrows move, Enter picks (never submits the product form), Esc/Tab close
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' || e.key === 'Tab') { closeAll(); return; }
    var input = comboInput(e.target);
    if (!input) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); e.stopPropagation();
      if (!panelOf(input)) openCombo(input, false);
      var p = panelOf(input);
      if (p) setHi(p, Number(p.dataset.hi || 0) + (e.key === 'ArrowDown' ? 1 : -1));
      return;
    }
    if (e.key === 'Enter') {
      e.preventDefault(); e.stopPropagation();
      var panel = panelOf(input);
      if (panel) {
        var hi = panel.querySelectorAll('.pf-cbx-item')[Number(panel.dataset.hi || 0)];
        if (hi) { pick(input, hi.dataset.v); return; }
      }
      var typed = input.value.trim();
      closeAll();
      if (!typed) return;
      var exact = optionsFor(input).find(function(v){ return String(v).toLowerCase() === typed.toLowerCase(); });
      if (exact) { pick(input, exact); return; }
      var plus = input.closest('.pf-ta').querySelector('.pf-plus');
      if (plus) plus.click();   // new name: same as pressing +
    }
  }, true);

  // mouse
  document.addEventListener('mousedown', function(e){
    var item = e.target.closest && e.target.closest('.pf-cbx-item');
    if (item) {
      e.preventDefault();
      pick(item.closest('.pf-ta').querySelector('input'), item.dataset.v);
      return;
    }
    if (!(e.target.closest && e.target.closest('.pf-ta'))) closeAll();
  });
})();
</script>
</body>
</html>
