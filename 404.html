<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — AdFlare</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0b0f;color:#fff;font-family:system-ui,sans-serif;text-align:center;padding:24px}
  h1{font-size:4rem;margin:0;color:#ff2b2b}
  p{color:#9a9aa5;margin:12px 0 28px}
  a{background:#ff2b2b;color:#fff;text-decoration:none;padding:14px 28px;border-radius:4px;font-weight:600}
</style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>This page doesn't exist.</p>
    <a id="home" href="/">Back to AdFlare</a>
  </div>
  <script>
    var p = location.pathname.split('/')[1];
    if (location.hostname.endsWith('github.io') && p) document.getElementById('home').href = '/' + p + '/';
  </script>
</body>
</html>
